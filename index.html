<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Among Us – Multiplayer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">AMONG US</div><nav><button onclick="openPanel('create')">Vytvoriť</button><button class="red" onclick="openPanel('join')">Hrať</button></nav></header>
<main><div class="card"><h1>Among Us</h1><p>Vytvor miestnosť alebo sa pripoj pomocou kódu.</p><div class="buttons"><button class="big red" onclick="openPanel('create')">Vytvoriť hru</button><button class="big" onclick="openPanel('join')">Hrať</button></div></div></main>

<div id="modal" class="modal"><div class="modal-box">
<button class="x" onclick="closePanel()">×</button>

<section id="create" class="panel">
<h2>Vytvoriť hru</h2><input id="hostName" maxlength="16" placeholder="Tvoje meno"><p class="hint">Vyber si ikonu. Každá farba môže byť použitá iba raz.</p><div id="createColors" class="color-grid"></div>
<button class="big red" onclick="createRoom()">Pokračovať</button>
</section>

<section id="join" class="panel">
<h2>Hrať</h2><input id="playerName" maxlength="16" placeholder="Tvoje meno"><input id="roomCodeInput" maxlength="6" placeholder="Kód miestnosti"><p class="hint">Vyber si voľnú ikonu.</p><div id="joinColors" class="color-grid"></div><button class="big red" onclick="joinRoom()">Pripojiť sa</button>
</section>

<section id="tasks" class="panel"><h2>Úlohy</h2><p class="hint">Hostiteľ nastaví úlohy pred začiatkom.</p><div id="taskList"></div><div class="task-form"><input id="taskLocation" maxlength="30" placeholder="Miesto"><input id="taskName" maxlength="60" placeholder="Úloha"><button class="big" onclick="addTask()">＋ Pridať úlohu</button></div><button class="big red" onclick="showLobby()">Pokračovať do lobby</button></section>

<section id="lobby" class="panel"><h2>Miestnosť <span id="roomCode"></span></h2><p class="hint">Pošli kód ostatným hráčom.</p><div id="players"></div><h3>Úlohy</h3><div id="lobbyTasks"></div><button id="editTasksBtn" class="big" onclick="openPanel('tasks')">Upraviť úlohy</button><button id="startBtn" class="big red" onclick="startGame()">Spustiť hru</button><p id="lobbyStatus" class="status"></p></section>

<section id="game" class="panel"><div id="gameRoot"></div></section>
</div></div>

<script>
let socket=null,state=null,myId=null,selectedCreate='red',selectedJoin='red',killTimer=null;
const COLORS=['red','blue','green','pink','orange','yellow','black','white','purple','brown','cyan','lime','navy','gray','coral'];
const labels={red:'Červená',blue:'Modrá',green:'Zelená',pink:'Ružová',orange:'Oranžová',yellow:'Žltá',black:'Čierna',white:'Biela',purple:'Fialová',brown:'Hnedá',cyan:'Azúrová',lime:'Limetková',navy:'Tmavomodrá',gray:'Sivá',coral:'Korálová'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function icon(color,size='small'){return `<span class="sus-icon ${color} ${size}"><span class="visor"></span><span class="leg l"></span><span class="leg r"></span></span>`}
function colorPicker(container,selected){document.getElementById(container).innerHTML=COLORS.map(c=>`<button class="color-choice ${c===selected?'selected':''}" data-color="${c}" onclick="selectColor('${container}','${c}')">${icon(c)}<span>${labels[c]}</span></button>`).join('');}
function selectColor(container,c){if(isTaken(c)) return alert('Táto farba/ikona je už obsadená.'); if(container==='createColors')selectedCreate=c;else selectedJoin=c;colorPicker(container,c);}
function isTaken(c){return !!state?.players?.some(p=>p.color===c);}
function connect(){const protocol=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(protocol+'//'+location.host);socket.onopen=()=>{};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='error')return alert(m.message);if(m.state){state=m.state;myId=state.me?.id||myId;renderState();}};socket.onclose=()=>{if(state) alert('Spojenie so serverom bolo prerušené.');};}
function send(d){if(!socket||socket.readyState!==WebSocket.OPEN)return alert('Nie si pripojený k serveru.');socket.send(JSON.stringify(d));}
function openPanel(id){document.getElementById('modal').classList.add('show');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='createColors'){} if(id==='tasks')renderTasks();}
function closePanel(){document.getElementById('modal').classList.remove('show');}
function createRoom(){const name=document.getElementById('hostName').value.trim();if(!name)return alert('Zadaj meno.');send({type:'create',name,color:selectedCreate});}
function joinRoom(){const name=document.getElementById('playerName').value.trim(),code=document.getElementById('roomCodeInput').value.trim().toUpperCase();if(!name||!code)return alert('Zadaj meno aj kód.');send({type:'join',name,code,color:selectedJoin});}
function addTask(){const location=document.getElementById('taskLocation').value.trim(),name=document.getElementById('taskName').value.trim();if(!location||!name)return alert('Vyplň miesto aj úlohu.');send({type:'addTask',location,name});document.getElementById('taskLocation').value='';document.getElementById('taskName').value='';}
function removeTask(i){send({type:'removeTask',index:i});}
function startGame(){if(!state.tasks.length)return alert('Najprv pridaj aspoň jednu úlohu.');send({type:'start'});}
function renderTasks(){const b=document.getElementById('taskList');if(!state)return;b.innerHTML=state.tasks.length?state.tasks.map((t,i)=>`<div class="task"><div><b>${i+1}. ${esc(t.name)}</b><small>📍 ${esc(t.location)}</small></div>${state.hostId===myId?`<button class="remove" onclick="removeTask(${i})">Odstrániť</button>`:''}</div>`).join(''):'<div class="empty">Zatiaľ žiadne úlohy.</div>';}
function showLobby(){if(!state)return;openPanel('lobby');renderLobby();}
function renderLobby(){document.getElementById('roomCode').textContent=state.code;document.getElementById('startBtn').style.display=state.hostId===myId?'block':'none';document.getElementById('editTasksBtn').style.display=state.hostId===myId?'block':'none';document.getElementById('players').innerHTML=state.players.map(p=>`<div class="player"><div class="who">${icon(p.color)}<span>${esc(p.name)}</span></div><span>${p.id===state.hostId?'👑 HOST':''}</span></div>`).join('');document.getElementById('lobbyTasks').innerHTML=state.tasks.map((t,i)=>`<div class="task compact"><div><b>${i+1}. ${esc(t.name)}</b><small>📍 ${esc(t.location)}</small></div></div>`).join('');document.getElementById('lobbyStatus').textContent=state.hostId===myId?'Si hostiteľ.':'Čakáš na hostiteľa.';}
function renderState(){if(!state)return; if(state.status==='lobby'){if(state.hostId===myId)openPanel('tasks');else showLobby();return;} if(state.status==='ended'){renderEnd();return;} renderGame();}
function renderEnd(){openPanel('game');document.getElementById('gameRoot').innerHTML=`<div class="end-screen"><div class="end-title ${state.result==='Crewmates'?'crew':'imp'}">${state.me.role===state.result?'YOU WON':'YOU LOST'}</div><div class="end-sub">${state.result==='Crewmates'?'CREWMATES WIN':'IMPOSTORS WIN'}</div><button class="big" onclick="location.reload()">Nová hra</button></div>`;}
function renderGame(){openPanel('game');const me=state.me; if(state.phase==='roleReveal'){document.getElementById('gameRoot').innerHTML=`<div class="role-reveal">${icon(me.color,'huge')}<h2>${me.role.toUpperCase()}</h2><p>${esc(me.name)}</p></div>`;return;} if(state.warning){renderWarning();return;} if(state.phase==='voting'){renderVoting();return;} if(state.phase==='result'){renderWarning();return;} if(state.hostId===myId){renderHost();return;} if(!me.alive){renderDeadPlayer();return;} if(me.role==='Impostor')renderImpostor();else renderCrewmate();}
function renderHost(){const alive=state.players.filter(p=>p.alive).length;document.getElementById('gameRoot').innerHTML=`<div class="host-screen"><div class="host-head"><h2>HOST / VIP</h2><div class="code">${state.code}</div></div><div class="host-list">${state.players.map(p=>`<div class="host-player ${p.alive?'alive':'dead'}"><div class="who">${icon(p.color)}<span>${esc(p.name)}</span></div><div class="host-stats"><span class="status-dot"></span><b>${p.alive?'ŽIVÝ':'MŔTVY'}</b><span class="tasks-count">${p.tasksDone}/${p.tasksTotal}</span>${p.alive&&p.id!==myId?`<button class="kill-mark" onclick="markDead('${p.id}')">Označiť DEAD</button>`:''}</div></div>`).join('')}</div><div class="host-actions"><button class="emergency" onclick="emergency()">EMERGENCY MEETING</button>${state.warning?`<button onclick="resolveWarning()">Vyriešiť</button>`:''}</div></div>`;}
function renderCrewmate(){const done=state.me.tasksDone,total=state.me.tasksTotal;document.getElementById('gameRoot').innerHTML=`<div class="player-screen">${topMe()}<div class="progress">Úlohy: ${done}/${total}</div><div class="my-tasks">${state.tasks.map((t,i)=>`<button class="task-card ${state.me.taskDone?.[i]?'done':''}" onclick="completeTask(${i})"><b>${esc(t.name)}</b><small>📍 ${esc(t.location)}</small><span>${state.me.taskDone?.[i]?'✓ HOTOVÉ':'SPLNIŤ'}</span></button>`).join('')}</div><button class="dead-oval" onclick="deadReport()">DEAD</button></div>`;}
function renderDeadPlayer(){document.getElementById('gameRoot').innerHTML=`<div class="player-screen dead-player-screen">${topMe()}<button class="report-big" onclick="deadReport()">DEAD BODY REPORT</button><div class="dead-hint">Mŕtvy hráč môže nahlásiť telo.</div></div>`;}
function renderImpostor(){const ready=Date.now()>=state.me.killReadyAt;const secs=Math.max(0,Math.ceil((state.me.killReadyAt-Date.now())/1000));document.getElementById('gameRoot').innerHTML=`<div class="player-screen imp-screen">${topMe()}<div class="imp-buttons"><button class="circle kill ${ready?'':'disabled'}" onclick="kill()">KILL${ready?'':`<small>${secs}s</small>`}</button><button class="circle air ${state.me.airUsed?'disabled':''}" onclick="air()">AIR</button></div><p class="imp-note">KILL iba spustí cooldown.</p></div>`;if(!ready)killTimer=setTimeout(renderGame,1000);}
function kill(){if(Date.now()<state.me.killReadyAt)return;send({type:'kill'});}
function air(){if(state.me.airUsed)return;send({type:'air'});}
function renderWarning(){const host=state.hostId===myId;let title=state.warning==='air'?'AIR':state.warning==='meeting'?'EMERGENCY MEETING':state.warning==='report'?'DEAD BODY REPORT':state.warningText;let sub=state.warning==='air'?`AIR stlačilo ${state.airCount} hráčov.`:'';document.getElementById('gameRoot').innerHTML=`<div class="warning-screen ${state.warning==='air'?'air-w':''}"><div class="warning-title">${esc(title)}</div>${sub?`<div class="warning-sub">${sub}</div>`:''}${state.warning==='air'&&!host&&state.me.alive&&state.me.role==='Crewmate'?`<button class="do-air" onclick="doAir()">DO AIR</button>`:''}${host?`<div class="warning-controls"><button class="big red" onclick="startVoting()">ZAČAŤ HLASOVANIE</button><button class="big" onclick="resolveWarning()">Vyriešiť a pokračovať</button></div>`:''}</div>`;}
function doAir(){send({type:'doAir'});}
function emergency(){send({type:'emergency'});}
function deadReport(){send({type:'deadReport'});}
function resolveWarning(){send({type:'resolveWarning'});}
function startVoting(){send({type:'startVoting'});}
function renderVoting(){const voted=state.voting?.votes?.[myId];const canVote=state.me.alive&&!voted;document.getElementById('gameRoot').innerHTML=`<div class="voting-screen"><h2>HLASOVANIE</h2><p>${voted?'Hlas bol odoslaný.':'Vyber hráča alebo SKIP.'}</p><div class="vote-grid">${state.players.filter(p=>p.alive).map(p=>`<button class="vote-card ${voted===p.id?'chosen':''}" onclick="vote('${p.id}')">${icon(p.color,'medium')}<b>${esc(p.name)}</b></button>`).join('')}</div><button class="skip" onclick="vote('SKIP')">SKIP</button>${state.hostId===myId?`<button class="host-finish" onclick="finishVote()">Ukončiť hlasovanie</button>`:''}</div>`;}
function vote(id){if(state.voting?.votes?.[myId])return;send({type:'vote',targetId:id});}
function finishVote(){send({type:'hostResolveVote'});}
function completeTask(i){if(state.me.taskDone?.[i])return;send({type:'completeTask',index:i});}
function markDead(id){send({type:'markDead',playerId:id});}
function topMe(){return `<div class="me-top">${icon(state.me.color,'medium')}<span>${esc(state.me.name)}</span></div>`;}
colorPicker('createColors',selectedCreate);colorPicker('joinColors',selectedJoin);connect();
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closePanel();});
</script>
</body>
</html>
